# dev-pipeline 配置说明

dev-pipeline 不读取这份文件作为配置——所有逻辑都硬编码在 `scripts/run-all.sh` 和 `scripts/run-step.sh` 里，方便读者一目了然。本文件只作为"约定速查表"。

## 8 个步骤与对应 skill

| 步骤 | Skill | 输入 | 输出 |
|------|-------|------|------|
| 1 | dev-arch | `inputs/arch-spec.md` | `1-arch.drawio` |
| 2 | dev-sequence | `inputs/sequence-spec.md` | `2-sequence.drawio` |
| 3 | dev-techspec | 项目名 + 当前用户 | `3-tech-spec.md` |
| 4 | dev-frontend-lint | `$FRONTEND_DIR`（默认 `./blog/frontend`） | `4-frontend-lint.md` |
| 5 | dev-backend-lint | `$BACKEND_DIR`（默认 `./blog/backend`） | `5-backend-lint.md` |
| 6 | dev-spec-diff | `$BACKEND_DIR` | `6-spec-diff.md` |
| 7 | dev-deps-audit | 前后端目录 | `7-deps-audit.md` |
| 8 | dev-apidoc | `inputs/openapi.json` | `8-api-spec.docx` |

## 环境变量

可通过环境变量覆盖默认值：

```bash
FRONTEND_DIR=./my-frontend BACKEND_DIR=./my-backend ./run-all.sh
```

## 输入目录约定

`run-all.sh` 期望 `INPUTS_DIR` 下有以下文件（缺失则跳过对应步骤）：

```
inputs/
├── arch-spec.md          # 架构描述（参见 dev-arch/references/arch-styles.md）
├── sequence-spec.md      # 时序描述（参见 dev-sequence/references/sequence-syntax.md）
└── openapi.json          # OpenAPI 3.0 JSON
```

## 跳过 vs 失败

- **跳过**：输入文件不存在 → 报告里标记 `⏭`，不影响其他步骤
- **失败**：脚本本身报错 → 标记 `⚠️`，日志写到 `/tmp/dev-pipeline.log`，继续后续步骤

设计原则：单步失败不阻塞 pipeline，最终给出整体清单。
